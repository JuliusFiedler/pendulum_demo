# GitLab Pages deployment: build the game to WebAssembly with pygbag and
# publish build/web as the static site. Served at the project's Pages URL.
# Requires GitLab Pages to be enabled on the instance (Deploy -> Pages).

pages:
  image: python:3.12-slim
  stage: deploy
  script:
    - pip install pygbag
    - python -m pygbag --build main.py
    - mkdir -p public
    - cp -r build/web/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "web"   # branch to deploy from; change to "main" if desired
