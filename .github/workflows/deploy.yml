name: Deploy to GitHub Pages

# Builds the pygame game to WebAssembly with pygbag and publishes build/web
# to GitHub Pages. GitHub-hosted runners do the build, so no self-hosted runner
# is needed (unlike the TU Chemnitz GitLab instance).

on:
  push:
    branches: [web]        # branch to deploy from; change to "main" if desired
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygbag
      - run: python -m pygbag --build main.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # auto-enable Pages (Actions source) via API on first run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
